<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMTP Email Sender</title>
  </head>
  <body class="bg-zinc-50 text-zinc-900 min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-zinc-200 p-8">
      <h1 class="text-2xl font-semibold mb-6 tracking-tight">Send Email</h1>
      
      <form id="emailForm" class="space-y-4">
        <div>
          <label for="subject" class="block text-sm font-medium text-zinc-700 mb-1">Subject</label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            required 
            placeholder="Enter email subject"
            class="w-full px-4 py-2 rounded-lg border border-zinc-300 focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none transition-all"
          />
        </div>
        
        <div>
          <label for="body" class="block text-sm font-medium text-zinc-700 mb-1">Body</label>
          <textarea 
            id="body" 
            name="body" 
            required 
            rows="5"
            placeholder="Write your message here..."
            class="w-full px-4 py-2 rounded-lg border border-zinc-300 focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none transition-all resize-none"
          ></textarea>
        </div>
        
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-zinc-900 text-white font-medium py-2.5 rounded-lg hover:bg-zinc-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Send Email
        </button>
      </form>
      
      <div id="status" class="mt-4 text-sm text-center hidden"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
